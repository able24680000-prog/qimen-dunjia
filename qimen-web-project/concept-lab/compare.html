<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奇门首页 v3 设计对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #20231f; color: #f2efe7; font-family: sans-serif; }
    main { width: 1280px; height: 720px; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    figure { margin: 0; min-width: 0; display: grid; grid-template-rows: 28px 1fr; }
    figcaption { font-size: 13px; }
    img { width: 100%; height: 100%; object-fit: contain; background: #f2efe7; border: 1px solid #62675e; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>设计基准 · 构图 A</figcaption><img src="../prototype-v3/design-reference.png" alt="宋版活盘设计基准"></figure>
    <figure><figcaption>网页实现 · 最终静帧</figcaption><img src="../prototype-v3/qa-desktop-1280.png" alt="宋版活盘网页实现"></figure>
  </main>
</body>
</html>
