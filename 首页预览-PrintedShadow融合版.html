<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>奇门遁甲首页预览 · Printed Shadow</title>
  <style>
    :root {
      --paper: #efeee8;
      --paper-light: #faf9f3;
      --paper-deep: #d9d7ce;
      --ink: #181815;
      --muted: rgba(24, 24, 21, .58);
      --line: rgba(24, 24, 21, .16);
      --line-strong: rgba(24, 24, 21, .32);
      --red: #9b342d;
      --bronze: #756b56;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); color: var(--ink); font-family: var(--sans); }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.74), transparent 28%),
        radial-gradient(circle at 82% 72%, rgba(97,91,78,.12), transparent 38%),
        linear-gradient(135deg, var(--paper-light), var(--paper) 48%, var(--paper-deep));
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .page {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 30%, rgba(24,24,21,.04) 0 1px, transparent 1.4px),
        radial-gradient(circle at 70% 20%, rgba(24,24,21,.03) 0 1px, transparent 1.4px),
        radial-gradient(circle at 44% 78%, rgba(24,24,21,.028) 0 1px, transparent 1.4px);
      background-size: 31px 33px, 47px 41px, 59px 53px;
    }
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 18%, rgba(24,24,21,.055) 18.05%, transparent 18.18% 78%, rgba(24,24,21,.045) 78.05%, transparent 78.18%),
        radial-gradient(ellipse at 52% 54%, rgba(255,255,255,.32), transparent 50%);
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: clamp(22px, 3vw, 44px) clamp(20px, 4vw, 72px) 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      justify-self: start;
    }
    .brand-mark {
      position: relative;
      width: 36px;
      aspect-ratio: 1;
      border: 1px solid rgba(24,24,21,.28);
      border-radius: 50%;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(24,24,21,.32);
      border-radius: 50%;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%);
    }
    .brand strong {
      display: block;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .16em;
      white-space: nowrap;
    }
    .brand small {
      display: block;
      margin-top: 2px;
      color: rgba(24,24,21,.48);
      font-size: 9px;
      letter-spacing: .22em;
      white-space: nowrap;
    }
    .nav {
      display: flex;
      gap: clamp(18px, 2.6vw, 44px);
      justify-self: center;
      color: rgba(24,24,21,.58);
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: .14em;
    }
    .nav a {
      position: relative;
      padding: 8px 0;
    }
    .nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0;
      transform: translateX(-50%) scale(.4);
      transition: opacity .18s ease, transform .18s var(--ease);
    }
    .nav a:hover::after, .nav a:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .time-tag {
      justify-self: end;
      display: inline-grid;
      grid-template-columns: auto 7px;
      align-items: center;
      gap: 10px;
      color: rgba(24,24,21,.54);
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: .12em;
    }
    .time-tag i {
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
    }

    .hero {
      min-height: calc(100dvh - 84px);
      display: grid;
      grid-template-columns: minmax(140px, .42fr) minmax(520px, 1fr) minmax(220px, .42fr);
      align-items: center;
      gap: clamp(24px, 4vw, 76px);
      padding: 0 clamp(20px, 4vw, 72px) clamp(34px, 5vh, 68px);
    }
    .title {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding-top: 4vh;
    }
    .title h1, .title p {
      margin: 0;
      writing-mode: vertical-rl;
      font-family: var(--serif);
    }
    .title h1 {
      font-size: clamp(36px, 3.35vw, 60px);
      font-weight: 400;
      line-height: 1.82;
      letter-spacing: .16em;
    }
    .title h1 span { color: var(--red); }
    .title p {
      max-height: 270px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      letter-spacing: .22em;
    }

    .stage {
      min-height: min(76dvh, 760px);
      display: grid;
      place-items: center;
      perspective: 1400px;
    }
    .folio {
      position: relative;
      width: min(58vw, 790px);
      min-width: 540px;
      aspect-ratio: 1.1;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.62), transparent 58%),
        rgba(246,245,239,.58);
      box-shadow: 0 26px 70px rgba(48,43,36,.12), inset 0 0 0 1px rgba(24,24,21,.08);
    }
    .folio::before {
      content: "";
      position: absolute;
      inset: 7.5% 9%;
      border: 1px solid rgba(24,24,21,.1);
      pointer-events: none;
    }
    .folio::after {
      content: "";
      position: absolute;
      left: 8.8%;
      top: 9.5%;
      bottom: 9.5%;
      width: 10px;
      background: repeating-linear-gradient(180deg, rgba(24,24,21,.28) 0 15px, transparent 15px 23px);
      opacity: .22;
      pointer-events: none;
    }
    .seal {
      position: absolute;
      left: 11.4%;
      bottom: 11%;
      width: 34px;
      aspect-ratio: 1;
      border: 1px solid rgba(155,52,45,.78);
      background: linear-gradient(90deg, transparent 45%, rgba(155,52,45,.26) 46% 54%, transparent 55%),
                  linear-gradient(0deg, transparent 45%, rgba(155,52,45,.26) 46% 54%, transparent 55%);
    }
    .instrument {
      position: relative;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: rotateX(52deg) rotateZ(-7deg);
      transform-style: preserve-3d;
      background:
        radial-gradient(circle at 50% 50%, rgba(248,247,241,.7) 0 5.4%, transparent 5.7%),
        radial-gradient(circle at 50% 50%, transparent 0 20%, rgba(55,57,52,.09) 20.3% 20.8%, transparent 21.1%),
        radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(55,57,52,.12) 34.2% 34.8%, transparent 35.1%),
        radial-gradient(circle at 50% 50%, transparent 0 48%, rgba(55,57,52,.15) 48.2% 48.8%, transparent 49.1%),
        radial-gradient(ellipse at 46% 39%, rgba(255,255,255,.42), transparent 44%),
        rgba(203,202,193,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.74), inset 0 -18px 44px rgba(55,57,52,.08);
      animation: breathe 9s var(--ease) infinite;
    }
    .instrument::before, .instrument::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .instrument::before {
      inset: 8%;
      border: 1px solid rgba(55,57,52,.24);
    }
    .instrument::after {
      inset: 16.5%;
      border: 1px solid rgba(55,57,52,.16);
    }
    .ticks {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
    }
    .ticks i {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 14px;
      background: rgba(55,57,52,.28);
      transform-origin: 0 205px;
    }
    .ticks i:nth-child(4n) {
      height: 22px;
      background: rgba(55,57,52,.42);
    }
    .qimen-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 25%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(24,24,21,.32);
      background: rgba(239,238,232,.16);
    }
    .qimen-grid span {
      border-right: 1px solid rgba(24,24,21,.18);
      border-bottom: 1px solid rgba(24,24,21,.18);
    }
    .qimen-grid span:nth-child(3n) { border-right: 0; }
    .qimen-grid span:nth-child(n + 7) { border-bottom: 0; }
    .gnomon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11%;
      height: 36%;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(-19deg);
      clip-path: polygon(50% 0, 59% 100%, 41% 100%);
      background: linear-gradient(90deg, transparent 0 40%, rgba(55,57,52,.72) 42% 58%, transparent 60%);
      filter: drop-shadow(34px 31px 10px rgba(24,24,21,.18));
    }
    .shadow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 1px;
      transform-origin: left center;
      transform: rotate(30deg);
      background: linear-gradient(90deg, rgba(24,24,21,.34), transparent);
      animation: shadowDrift 12s var(--ease) infinite;
    }
    .entry-dot {
      position: absolute;
      left: 68.7%;
      top: 41.8%;
      width: 9px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 6px rgba(155,52,45,.12);
      transition: transform .22s var(--ease), box-shadow .22s var(--ease);
    }
    .folio:hover .entry-dot,
    .folio:focus-visible .entry-dot {
      transform: scale(1.28);
      box-shadow: 0 0 0 9px rgba(155,52,45,.14);
    }
    .entry-copy {
      position: absolute;
      left: 50%;
      bottom: 7.4%;
      display: grid;
      justify-items: center;
      gap: 8px;
      transform: translateX(-50%);
      color: rgba(24,24,21,.68);
      font-family: var(--serif);
      letter-spacing: .16em;
    }
    .entry-copy strong {
      font-size: 17px;
      font-weight: 500;
    }
    .entry-copy i {
      width: 6px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
    }
    .time-scale {
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: 4.4%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(24,24,21,.18), transparent);
    }

    .notes {
      justify-self: end;
      max-width: 280px;
      color: var(--muted);
      font-family: var(--serif);
    }
    .notes blockquote {
      margin: 0 0 clamp(28px, 5vh, 56px);
      padding: 0;
      font-size: 16px;
      line-height: 2.05;
      letter-spacing: .11em;
    }
    .note-list {
      display: grid;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .note-list li {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 14px;
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: .08em;
    }
    .note-list li::before {
      content: "";
      width: 6px;
      aspect-ratio: 1;
      margin-top: 10px;
      border-radius: 50%;
      background: var(--red);
      opacity: .72;
    }
    .note-list strong {
      display: block;
      color: rgba(24,24,21,.82);
      font-weight: 500;
    }
    .note-list span {
      display: block;
      margin-top: 2px;
      color: rgba(24,24,21,.5);
      font-size: 12px;
    }
    .mobile-summary { display: none; }

    .page.ready .title,
    .page.ready .stage,
    .page.ready .notes {
      animation: reveal .86s var(--ease) both;
    }
    .page.ready .stage { animation-delay: .08s; }
    .page.ready .notes { animation-delay: .15s; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes breathe {
      0%, 100% { filter: saturate(.96); }
      50% { filter: saturate(1.04); }
    }
    @keyframes shadowDrift {
      0%, 100% { opacity: .8; transform: rotate(29deg); }
      50% { opacity: .56; transform: rotate(33deg); }
    }

    @media (max-width: 1120px) {
      .hero {
        grid-template-columns: minmax(120px,.32fr) minmax(450px,1fr) minmax(190px,.38fr);
        gap: 28px;
      }
      .folio { min-width: 460px; }
      .notes { max-width: 235px; }
    }
    @media (max-width: 860px) {
      .topbar {
        grid-template-columns: 1fr auto;
        padding: 18px 18px 0;
      }
      .nav { display: none; }
      .time-tag { font-size: 12px; letter-spacing: .08em; }
      .hero {
        min-height: calc(100dvh - 60px);
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 24px 18px 28px;
      }
      .title {
        display: block;
        align-self: auto;
        padding: 0;
      }
      .title h1, .title p { writing-mode: horizontal-tb; }
      .title h1 {
        font-size: clamp(30px, 8vw, 44px);
        line-height: 1.3;
        letter-spacing: .08em;
      }
      .title p {
        margin-top: 10px;
        max-height: none;
        font-size: 13px;
        line-height: 1.7;
        letter-spacing: .08em;
      }
      .stage { min-height: 54dvh; }
      .folio {
        width: min(94vw, 560px);
        min-width: 0;
      }
      .notes { display: none; }
      .mobile-summary {
        display: block;
        padding-top: 12px;
        border-top: 1px solid rgba(24,24,21,.12);
        color: rgba(24,24,21,.58);
        font-family: var(--serif);
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: .08em;
      }
    }
    @media (max-width: 520px) {
      .brand strong { font-size: 15px; }
      .brand small { display: none; }
      .brand-mark { width: 31px; }
      .stage { min-height: 50dvh; }
      .folio { width: 100%; }
      .entry-copy { bottom: 5.2%; }
      .entry-copy strong { font-size: 15px; }
      .seal { width: 27px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="奇门遁甲首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>奇门遁甲</strong>
          <small>QIMEN DUNJIA</small>
        </span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#">排盘</a>
        <a href="#">知识</a>
        <a href="#">案例</a>
        <a href="#">关于</a>
      </nav>
      <span class="time-tag">今日择时<i aria-hidden="true"></i></span>
    </header>

    <main class="hero">
      <section class="title" aria-label="首页标题">
        <h1><span>心</span>起，则局生</h1>
        <p>以日影定时，以九宫成局</p>
      </section>

      <section class="stage" aria-label="排盘入口">
        <a class="folio" href="#" aria-label="循影入局，进入排盘">
          <span class="seal" aria-hidden="true"></span>
          <span class="instrument" aria-hidden="true">
            <span class="ticks" id="ticks"></span>
            <span class="shadow"></span>
            <span class="gnomon"></span>
            <span class="qimen-grid">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </span>
            <span class="entry-dot"></span>
          </span>
          <span class="entry-copy">
            <strong>循影入局</strong>
            <i aria-hidden="true"></i>
          </span>
          <span class="time-scale" aria-hidden="true"></span>
        </a>
      </section>

      <aside class="notes" aria-label="首页说明">
        <blockquote>书页承载秩序，日影指向当下。九宫不外露炫技，只在版心中等待被进入。</blockquote>
        <ul class="note-list">
          <li><span><strong>版心</strong><span>以宋版书页组织首页结构</span></span></li>
          <li><span><strong>日影</strong><span>把择时变成可见的入口</span></span></li>
          <li><span><strong>九宫</strong><span>藏于仪器核心，避免符号堆砌</span></span></li>
        </ul>
      </aside>

      <section class="mobile-summary" aria-label="移动端说明">
        书页承载秩序，日影指向当下。点击版心，即可进入排盘。
      </section>
    </main>
  </div>

  <script>
    const page = document.getElementById('page');
    const ticks = document.getElementById('ticks');
    for (let i = 0; i < 60; i += 1) {
      const tick = document.createElement('i');
      tick.style.transform = `rotate(${i * 6}deg)`;
      ticks.appendChild(tick);
    }
    window.addEventListener('load', () => page.classList.add('ready'));
  </script>
</body>
</html>
