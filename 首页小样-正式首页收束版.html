<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奇门遁甲首页小样 · 正式首页收束版</title>
  <style>
    :root {
      --paper: #f5f2eb;
      --paper-deep: #e8e2d5;
      --ink: #292724;
      --ink-soft: rgba(41, 39, 36, 0.66);
      --line: rgba(96, 82, 68, 0.16);
      --red: #b63a30;
      --red-deep: #6f1713;
      --jade: #355b53;
      --white: rgba(255, 255, 255, 0.92);
      --shadow: rgba(39, 30, 23, 0.22);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--paper);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .sample-home {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% -8%, #fff 0 15%, rgba(255,255,255,0.72) 22%, transparent 44%),
        radial-gradient(ellipse at 48% 82%, rgba(255,255,255,0.76) 0 14%, rgba(255,255,255,0.18) 34%, transparent 58%),
        linear-gradient(90deg, rgba(255,255,255,0.88) 0%, rgba(248,246,241,0.96) 34%, rgba(213,207,195,0.48) 74%, rgba(84,82,76,0.18) 100%),
        var(--paper);
    }

    .sample-home::before,
    .sample-home::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sample-home::before {
      z-index: -3;
      background:
        linear-gradient(90deg, transparent 0 22.8%, var(--line) 22.9%, transparent 23.08%, transparent 58.2%, var(--line) 58.3%, transparent 58.48%),
        radial-gradient(circle at 50% 76%, rgba(255,255,255,0.32) 0 5%, transparent 25%);
    }

    .sample-home::after {
      z-index: -2;
      background:
        linear-gradient(90deg, transparent 0 68%, rgba(43, 41, 38, 0.16) 100%),
        radial-gradient(ellipse at 82% 50%, rgba(34, 34, 31, 0.18), transparent 48%);
      opacity: 0.78;
    }

    .room {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .oculus {
      position: absolute;
      top: min(-9vw, -64px);
      left: 50%;
      width: min(52vw, 780px);
      aspect-ratio: 3 / 1;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, #fff 0 38%, rgba(222, 216, 204, 0.88) 43%, rgba(153, 145, 130, 0.26) 58%, transparent 72%);
      filter: drop-shadow(0 22px 34px rgba(67, 61, 51, 0.13));
    }

    .horizon {
      position: absolute;
      top: 66%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.86), rgba(74,68,58,0.16), transparent);
    }

    .nav {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(24px, 3vw, 46px) clamp(22px, 4vw, 64px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-seal {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(41, 39, 36, 0.42);
      border-radius: 50%;
      background: rgba(255,255,255,0.26);
    }

    .brand-seal::before {
      content: "";
      width: 22px;
      aspect-ratio: 1;
      border: 1px solid rgba(41, 39, 36, 0.46);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 34%, var(--red) 0 2px, transparent 2.5px),
        radial-gradient(circle at 63% 64%, rgba(41,39,36,0.64) 0 1.6px, transparent 2px);
    }

    .brand strong {
      display: block;
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.14em;
      white-space: nowrap;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: rgba(41, 39, 36, 0.58);
      font-size: 9px;
      letter-spacing: 0.22em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 40px);
      color: rgba(41, 39, 36, 0.74);
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      font-size: 14px;
      letter-spacing: 0.16em;
    }

    .nav-links a {
      position: relative;
      padding: 8px 0;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0;
      transform: translateX(-50%) scale(0.4);
      transition: opacity 180ms ease, transform 180ms var(--ease);
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .menu {
      display: none;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(41,39,36,0.16);
      border-radius: 50%;
      background: rgba(255,255,255,0.42);
      color: var(--ink);
      cursor: pointer;
    }

    .menu span,
    .menu::before,
    .menu::after {
      content: "";
      display: block;
      width: 17px;
      height: 1px;
      background: currentColor;
    }

    .menu span {
      position: absolute;
      opacity: 0;
    }

    .menu::before {
      transform: translateY(-4px);
    }

    .menu::after {
      transform: translateY(4px);
    }

    .hero {
      position: relative;
      z-index: 5;
      min-height: calc(100svh - 88px);
      display: grid;
      grid-template-columns: minmax(140px, 0.58fr) minmax(420px, 1.25fr) minmax(250px, 0.72fr);
      align-items: center;
      gap: clamp(18px, 3vw, 56px);
      padding: 0 clamp(24px, 4vw, 72px) clamp(44px, 5vh, 72px);
    }

    .copy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2vw, 30px);
      align-self: stretch;
      padding-top: 4vh;
    }

    .copy h1,
    .copy p {
      margin: 0;
      writing-mode: vertical-rl;
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    }

    .copy h1 {
      color: rgba(41, 39, 36, 0.9);
      font-size: clamp(34px, 3vw, 56px);
      font-weight: 400;
      letter-spacing: 0.13em;
      line-height: 1.85;
    }

    .copy h1 span {
      color: var(--red);
    }

    .copy p {
      max-height: 260px;
      color: rgba(41, 39, 36, 0.62);
      font-size: 14px;
      letter-spacing: 0.2em;
      line-height: 1.85;
    }

    .artifact-wrap {
      position: relative;
      display: grid;
      min-height: min(76vh, 780px);
      place-items: center;
    }

    .artifact {
      position: relative;
      width: min(54vw, 780px);
      min-width: 520px;
      height: min(78vh, 780px);
      min-height: 560px;
      transform: translateY(-1vh);
      contain: layout paint;
    }

    .axis {
      position: absolute;
      z-index: 2;
      top: 4%;
      left: 50%;
      width: 2px;
      height: 76%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent, rgba(182,58,48,0.18) 20%, rgba(255,255,255,0.78) 46%, rgba(182,58,48,0.22) 72%, transparent);
      box-shadow: 0 0 34px rgba(255,255,255,0.52), 0 0 42px rgba(182,58,48,0.12);
      animation: axisPulse 6.8s var(--ease) infinite;
    }

    .aura {
      position: absolute;
      z-index: 1;
      top: 41%;
      left: 50%;
      width: min(24vw, 300px);
      height: 58%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.48), transparent 62%);
      filter: blur(17px);
      animation: auraBreath 7.4s var(--ease) infinite;
    }

    .particles {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 50%;
      width: 214px;
      height: 62%;
      transform: translateX(-50%);
      opacity: 0.86;
    }

    .particles::before,
    .particles::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .particles::before {
      top: 18%;
      width: 64%;
      height: 56%;
      border-left: 1px solid rgba(182,58,48,0.14);
      border-right: 1px solid rgba(255,255,255,0.28);
      border-radius: 50%;
    }

    .particles::after {
      top: 12%;
      width: 3px;
      height: 70%;
      background: linear-gradient(180deg, transparent, rgba(182,58,48,0.2), rgba(255,255,255,0.7), rgba(182,58,48,0.18), transparent);
    }

    .dot {
      position: absolute;
      width: var(--s, 4px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,232,222,0.98), rgba(182,58,48,0.94) 58%, transparent 74%);
      box-shadow: 0 0 10px rgba(182,58,48,0.36);
      animation: dotDrift var(--d, 6.4s) var(--ease) infinite;
      animation-delay: var(--delay, 0s);
    }

    .sphere {
      position: absolute;
      z-index: 8;
      top: 20%;
      left: 50%;
      width: clamp(148px, 12vw, 208px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 34% 25%, rgba(255,255,255,0.96) 0 8%, rgba(255,235,226,0.56) 9%, transparent 22%),
        radial-gradient(circle at 60% 62%, rgba(255,116,88,0.86) 0 10%, rgba(171,33,25,0.93) 38%, rgba(73,8,7,0.96) 74%),
        conic-gradient(from 210deg, rgba(255,255,255,0.18), rgba(139,22,18,0.74), rgba(255,125,93,0.28), rgba(74,8,8,0.9), rgba(255,255,255,0.14));
      box-shadow:
        inset -28px -34px 42px rgba(38,0,0,0.5),
        inset 20px 18px 42px rgba(255,188,162,0.34),
        0 26px 46px rgba(91,16,13,0.29),
        0 0 64px rgba(182,58,48,0.26);
      animation: sphereFloat 8.8s var(--ease) infinite;
    }

    .sphere::before,
    .sphere::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .sphere::before {
      inset: 10%;
      border: 1px solid rgba(255,235,225,0.34);
      box-shadow: inset 0 0 22px rgba(255,255,255,0.08);
      transform: rotate(-21deg);
    }

    .sphere::after {
      inset: -9%;
      border: 1px solid rgba(255,255,255,0.18);
      border-left-color: rgba(182,58,48,0.22);
      border-right-color: rgba(182,58,48,0.18);
      transform: rotate(18deg) scaleY(0.68);
    }

    .matrix {
      position: absolute;
      z-index: 5;
      top: 42%;
      left: 50%;
      width: 300px;
      height: 212px;
      transform: translateX(-50%);
      opacity: 0.92;
    }

    .matrix span {
      position: absolute;
      left: 50%;
      width: var(--w);
      height: var(--h);
      border: 1px solid rgba(255,255,255,0.58);
      border-radius: 50%;
      transform: translateX(-50%) rotateX(64deg);
      box-shadow: 0 0 18px rgba(255,255,255,0.14);
      animation: matrixDrift 6.6s var(--ease) infinite;
      animation-delay: var(--delay);
    }

    .disc-link {
      position: absolute;
      z-index: 9;
      left: 50%;
      bottom: 10%;
      width: clamp(300px, 29vw, 440px);
      aspect-ratio: 4.25 / 1;
      transform: translateX(-50%);
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 47% 38%, rgba(255,255,255,1) 0 25%, rgba(238,232,219,0.94) 49%, rgba(162,153,133,0.42) 100%);
      box-shadow:
        0 18px 30px rgba(54,48,40,0.24),
        0 32px 58px rgba(54,48,40,0.14),
        inset 0 3px 9px rgba(255,255,255,0.98);
      cursor: pointer;
    }

    .disc-link::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 34%;
      width: 42%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%) rotateX(58deg);
      border: 1px solid rgba(182,58,48,0.22);
      border-radius: 50%;
      box-shadow: inset 0 0 0 9px rgba(255,255,255,0.18), 0 0 22px rgba(182,58,48,0.1);
    }

    .disc-face {
      position: absolute;
      left: 50%;
      top: 39%;
      width: 48%;
      aspect-ratio: 1;
      border: 1px solid rgba(41,39,36,0.24);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(58deg);
    }

    .disc-face i {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 1px;
      height: 8px;
      background: rgba(41,39,36,0.22);
      transform-origin: 0 calc(50% + 40px);
    }

    .disc-face b {
      position: absolute;
      inset: 37%;
      border: 1px solid rgba(182,58,48,0.62);
      border-radius: 50%;
    }

    .water {
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: 0;
      width: min(70vw, 1040px);
      aspect-ratio: 3.8 / 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(255,255,255,0.7) 0 6%, rgba(255,255,255,0.24) 20%, transparent 56%),
        repeating-radial-gradient(ellipse at center, rgba(255,255,255,0.46) 0 1px, transparent 2px 18px);
      animation: waterBreath 9s var(--ease) infinite;
    }

    .cta {
      position: absolute;
      z-index: 15;
      left: 50%;
      bottom: clamp(18px, 4vh, 42px);
      display: inline-grid;
      grid-template-columns: auto 18px;
      align-items: center;
      gap: 12px;
      min-width: 168px;
      min-height: 48px;
      padding: 10px 20px 10px 24px;
      transform: translateX(-50%);
      border: 1px solid rgba(182,58,48,0.38);
      border-radius: 999px;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 14px 38px rgba(62, 46, 34, 0.12);
      color: rgba(41,39,36,0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 220ms var(--ease), border-color 220ms ease, color 220ms ease, background 220ms ease;
    }

    .cta strong {
      display: block;
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .cta small {
      display: block;
      margin-top: 1px;
      color: rgba(41,39,36,0.48);
      font-size: 9px;
      letter-spacing: 0.28em;
    }

    .cta i {
      width: 16px;
      aspect-ratio: 1;
      border: 1px solid var(--red);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(182,58,48,0.28);
    }

    .cta:hover,
    .cta:focus-visible {
      color: var(--red);
      border-color: rgba(182,58,48,0.66);
      background: rgba(255,255,255,0.7);
      transform: translateX(-50%) translateY(-2px);
      outline: none;
    }

    .path {
      position: relative;
      align-self: center;
      justify-self: end;
      width: min(100%, 310px);
      padding: 10px 0 10px 26px;
      color: rgba(41,39,36,0.74);
    }

    .path::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(41,39,36,0.18), transparent);
    }

    .path-kicker {
      margin: 0 0 clamp(24px, 5vh, 46px);
      max-width: 16em;
      color: rgba(41,39,36,0.62);
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      font-size: 15px;
      letter-spacing: 0.12em;
      line-height: 2;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 58px;
      align-items: center;
      gap: 18px;
      min-height: 78px;
      opacity: 0.78;
      transition: opacity 180ms ease, transform 180ms var(--ease);
    }

    .stage::before {
      content: "";
      position: absolute;
      left: -21px;
      top: 50%;
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(41,39,36,0.34);
      transform: translateY(-50%);
    }

    .stage.is-active,
    .stage:hover {
      opacity: 1;
      transform: translateX(-2px);
    }

    .stage.is-active::before,
    .stage:hover::before {
      background: var(--red);
      box-shadow: 0 0 14px rgba(182,58,48,0.28);
    }

    .stage strong {
      display: block;
      color: rgba(41,39,36,0.86);
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.16em;
    }

    .stage small {
      display: block;
      margin-top: 3px;
      color: rgba(41,39,36,0.46);
      font-size: 8px;
      letter-spacing: 0.24em;
    }

    .stage span {
      display: block;
      margin-top: 6px;
      color: rgba(41,39,36,0.52);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .stage svg {
      width: 58px;
      height: 58px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.1;
      opacity: 0.62;
    }

    .stage.is-active svg,
    .stage:hover svg {
      color: var(--red);
      opacity: 0.86;
    }

    .mobile-panel {
      display: none;
    }

    .sample-home.loaded .nav,
    .sample-home.loaded .copy,
    .sample-home.loaded .path,
    .sample-home.loaded .cta {
      animation: revealSoft 820ms var(--ease) both;
    }

    .sample-home.loaded .copy {
      animation-delay: 90ms;
    }

    .sample-home.loaded .path {
      animation-delay: 170ms;
    }

    .sample-home.loaded .cta {
      animation-delay: 260ms;
    }

    @keyframes revealSoft {
      from {
        opacity: 0;
        transform: translate3d(0, 14px, 0);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
        filter: blur(0);
      }
    }

    @keyframes sphereFloat {
      0%, 100% {
        transform: translateX(-50%) translate3d(0, -5px, 0) scale(1);
      }
      50% {
        transform: translateX(-50%) translate3d(0, 11px, 0) scale(1.025);
      }
    }

    @keyframes dotDrift {
      0%, 100% {
        opacity: 0.24;
        transform: translate3d(0, -7px, 0) scale(var(--scale, 1));
      }
      50% {
        opacity: 0.86;
        transform: translate3d(7px, 8px, 0) scale(calc(var(--scale, 1) + 0.14));
      }
    }

    @keyframes matrixDrift {
      0%, 100% {
        opacity: 0.36;
        transform: translateX(-50%) rotateX(64deg) translateY(0) scaleX(0.94);
      }
      50% {
        opacity: 0.76;
        transform: translateX(-50%) rotateX(64deg) translateY(-7px) scaleX(1);
      }
    }

    @keyframes auraBreath {
      0%, 100% {
        opacity: 0.38;
        transform: translate(-50%, -50%) scale(0.94);
      }
      50% {
        opacity: 0.66;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    @keyframes axisPulse {
      0%, 100% {
        opacity: 0.48;
      }
      50% {
        opacity: 0.82;
      }
    }

    @keyframes waterBreath {
      0%, 100% {
        opacity: 0.72;
        transform: translateX(-50%) scaleX(0.985);
      }
      50% {
        opacity: 0.94;
        transform: translateX(-50%) scaleX(1.035);
      }
    }

    @media (max-width: 1120px) {
      .hero {
        grid-template-columns: 0.45fr minmax(390px, 1.1fr) minmax(220px, 0.62fr);
        gap: 20px;
      }

      .artifact {
        min-width: 470px;
      }

      .path {
        width: 250px;
      }

      .path-kicker {
        font-size: 14px;
      }

      .stage {
        grid-template-columns: 1fr 46px;
        min-height: 70px;
        gap: 12px;
      }

      .stage svg {
        width: 46px;
        height: 46px;
      }
    }

    @media (max-width: 880px) {
      .sample-home {
        min-height: 100svh;
        background:
          radial-gradient(ellipse at 50% -7%, #fff 0 14%, rgba(255,255,255,0.66) 25%, transparent 44%),
          linear-gradient(180deg, rgba(255,255,255,0.94), rgba(245,242,235,0.96) 56%, rgba(227,222,212,0.92));
      }

      .sample-home::after {
        display: none;
      }

      .nav {
        padding: 18px 18px 0;
      }

      .nav-links {
        position: fixed;
        inset: 76px 18px auto;
        display: none;
        z-index: 40;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        padding: 10px;
        border: 1px solid rgba(41,39,36,0.12);
        background: rgba(250,248,243,0.92);
        box-shadow: 0 20px 50px rgba(64,50,36,0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .nav-links.is-open {
        display: grid;
      }

      .nav-links a {
        display: grid;
        min-height: 42px;
        place-items: center;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .menu {
        display: grid;
      }

      .hero {
        min-height: calc(100svh - 66px);
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0 16px 22px;
      }

      .copy {
        align-self: auto;
        justify-content: flex-start;
        min-height: 92px;
        padding: 12px 2px 0;
      }

      .copy h1,
      .copy p {
        writing-mode: horizontal-tb;
      }

      .copy {
        display: block;
      }

      .copy h1 {
        font-size: clamp(30px, 8vw, 42px);
        line-height: 1.28;
        letter-spacing: 0.08em;
      }

      .copy p {
        margin-top: 9px;
        max-width: 24em;
        font-size: 13px;
        line-height: 1.7;
        letter-spacing: 0.08em;
      }

      .artifact-wrap {
        min-height: 54svh;
        align-self: center;
      }

      .artifact {
        width: 100%;
        min-width: 0;
        max-width: 500px;
        height: 56svh;
        min-height: 420px;
        transform: none;
      }

      .sphere {
        top: 18%;
        width: clamp(118px, 31vw, 148px);
      }

      .particles {
        width: 170px;
        height: 58%;
      }

      .matrix {
        top: 40%;
        width: 230px;
      }

      .matrix span {
        width: calc(var(--w) * 0.76);
      }

      .disc-link {
        bottom: 12%;
        width: clamp(248px, 72vw, 320px);
      }

      .water {
        width: 118vw;
      }

      .cta {
        position: relative;
        left: auto;
        bottom: auto;
        justify-self: center;
        transform: none;
        margin-top: -22px;
      }

      .cta:hover,
      .cta:focus-visible {
        transform: translateY(-2px);
      }

      .path {
        display: none;
      }

      .mobile-panel {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
        max-width: 520px;
        justify-self: center;
        margin-top: 18px;
      }

      .mobile-panel span {
        display: grid;
        min-height: 34px;
        place-items: center;
        border-top: 1px solid rgba(41,39,36,0.14);
        color: rgba(41,39,36,0.66);
        font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
        font-size: 12px;
        letter-spacing: 0.1em;
      }
    }

    @media (max-width: 520px) {
      .brand strong {
        font-size: 15px;
      }

      .brand small {
        display: none;
      }

      .brand-seal {
        width: 36px;
      }

      .copy p {
        max-width: 20em;
      }

      .artifact {
        height: 50svh;
        min-height: 380px;
      }

      .axis {
        height: 72%;
      }

      .matrix {
        top: 39%;
        width: 210px;
      }

      .disc-link {
        bottom: 14%;
        width: 244px;
      }

      .cta {
        min-width: 156px;
        min-height: 46px;
      }

      .cta strong {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <section class="sample-home" id="home">
    <div class="room" aria-hidden="true">
      <span class="oculus"></span>
      <span class="horizon"></span>
    </div>

    <header class="nav">
      <a class="brand" href="#" aria-label="奇门遁甲首页">
        <span class="brand-seal" aria-hidden="true"></span>
        <span>
          <strong>奇门遁甲</strong>
          <small>QIMEN DUNJIA</small>
        </span>
      </a>
      <nav class="nav-links" id="navLinks" aria-label="主导航">
        <a href="#">缘起</a>
        <a href="#">排盘</a>
        <a href="#">知识</a>
        <a href="#">案例</a>
        <a href="#">关于</a>
      </nav>
      <button class="menu" id="menuButton" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="打开导航">
        <span></span>
      </button>
    </header>

    <main class="hero">
      <section class="copy" aria-label="首页主文案">
        <h1><span>心</span>起，则局生</h1>
        <p>由数入象，由象入局</p>
      </section>

      <section class="artifact-wrap" aria-label="起局入口">
        <div class="artifact">
          <div class="axis" aria-hidden="true"></div>
          <div class="aura" aria-hidden="true"></div>
          <div class="particles" aria-hidden="true" id="particles"></div>
          <div class="sphere" aria-hidden="true"></div>
          <div class="matrix" aria-hidden="true">
            <span style="--w: 278px; --h: 72px; top: 8px; --delay: 0s"></span>
            <span style="--w: 218px; --h: 60px; top: 68px; --delay: -1.5s"></span>
            <span style="--w: 148px; --h: 48px; top: 124px; --delay: -3s"></span>
          </div>
          <a class="disc-link" href="#" aria-label="进入排盘">
            <span class="disc-face" aria-hidden="true" id="discFace"><b></b></span>
          </a>
          <div class="water" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="path" aria-label="奇门演化路径">
        <p class="path-kicker">河图定数，洛书成位，八卦开象，奇门成局。</p>

        <div class="stage is-active">
          <div>
            <strong>河图</strong>
            <small>HETU</small>
            <span>数从中起</span>
          </div>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="2.8"></circle>
            <circle cx="12" cy="18" r="2"></circle>
            <circle cx="22" cy="18" r="2"></circle>
            <circle cx="42" cy="46" r="2"></circle>
            <circle cx="52" cy="46" r="2"></circle>
            <line x1="14" y1="18" x2="50" y2="46"></line>
            <line x1="14" y1="46" x2="50" y2="18"></line>
          </svg>
        </div>

        <div class="stage">
          <div>
            <strong>洛书</strong>
            <small>LUOSHU</small>
            <span>位各有序</span>
          </div>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <line x1="16" y1="10" x2="16" y2="54"></line>
            <line x1="32" y1="10" x2="32" y2="54"></line>
            <line x1="48" y1="10" x2="48" y2="54"></line>
            <line x1="10" y1="16" x2="54" y2="16"></line>
            <line x1="10" y1="32" x2="54" y2="32"></line>
            <line x1="10" y1="48" x2="54" y2="48"></line>
          </svg>
        </div>

        <div class="stage">
          <div>
            <strong>八卦</strong>
            <small>BAGUA</small>
            <span>象由时开</span>
          </div>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="10"></circle>
            <path d="M32 22a10 10 0 0 1 0 20 5 5 0 0 1 0-10 5 5 0 0 0 0-10Z"></path>
            <line x1="30" y1="6" x2="34" y2="6"></line>
            <line x1="27" y1="11" x2="37" y2="11"></line>
            <line x1="30" y1="58" x2="34" y2="58"></line>
            <line x1="27" y1="53" x2="37" y2="53"></line>
          </svg>
        </div>

        <div class="stage">
          <div>
            <strong>奇门盘</strong>
            <small>QIMEN PAN</small>
            <span>一念成局</span>
          </div>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="24"></circle>
            <circle cx="32" cy="32" r="16"></circle>
            <circle cx="32" cy="32" r="7"></circle>
            <line x1="32" y1="8" x2="32" y2="14"></line>
            <line x1="32" y1="50" x2="32" y2="56"></line>
            <line x1="8" y1="32" x2="14" y2="32"></line>
            <line x1="50" y1="32" x2="56" y2="32"></line>
          </svg>
        </div>
      </aside>

      <a class="cta" href="#">
        <span>
          <strong>起局</strong>
          <small>ENTER PAN</small>
        </span>
        <i aria-hidden="true"></i>
      </a>

      <div class="mobile-panel" aria-label="奇门演化简表">
        <span>河图</span>
        <span>洛书</span>
        <span>八卦</span>
        <span>奇门盘</span>
      </div>
    </main>
  </section>

  <script>
    const home = document.getElementById('home');
    const menuButton = document.getElementById('menuButton');
    const navLinks = document.getElementById('navLinks');
    const particles = document.getElementById('particles');
    const discFace = document.getElementById('discFace');

    window.addEventListener('load', () => {
      home.classList.add('loaded');
    });

    menuButton.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? '关闭导航' : '打开导航');
    });

    const dotLayout = [
      [42, 4, 4, 0.7], [55, 5, 3, 1.1], [64, 8, 4, 0.9], [49, 13, 2, 1.2],
      [57, 18, 3, 0.8], [44, 24, 4, 1], [66, 27, 3, 1.15], [51, 32, 5, 0.72],
      [60, 38, 3, 1], [43, 45, 3, 0.8], [56, 50, 4, 1.18], [49, 58, 2, 0.96],
      [63, 64, 4, 0.76], [46, 70, 3, 1.08], [55, 78, 2, 0.82]
    ];

    dotLayout.forEach(([left, top, size, scale], index) => {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.left = `${left}%`;
      dot.style.top = `${top}%`;
      dot.style.setProperty('--s', `${size}px`);
      dot.style.setProperty('--scale', scale);
      dot.style.setProperty('--d', `${6 + (index % 4) * 0.5}s`);
      dot.style.setProperty('--delay', `${index * -0.32}s`);
      particles.appendChild(dot);
    });

    for (let index = 0; index < 36; index += 1) {
      const tick = document.createElement('i');
      tick.style.transform = `rotate(${index * 10}deg)`;
      discFace.appendChild(tick);
    }
  </script>
</body>
</html>
